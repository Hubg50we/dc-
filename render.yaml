services:
  - type: web
    name: dc-discord-server
    env: python
    buildCommand: pip install -r requirements.txt yt-dlp
    startCommand: python main.py
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: AUTO_REJOIN
        value: "true"
      - key: STEALTH_DELAY
        value: "0.1"
