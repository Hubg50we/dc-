name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Package Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer & Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip
          pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv wheel setuptools

      - name: Build Android APK with Buildozer
        run: |
          buildozer android debug
        env:
          ACCEPT_ANDROID_SDK_LICENSES: '1'

      - name: Find and Rename APK
        id: find_apk
        run: |
          mkdir -p release_bin
          APK_FILE=$(find bin/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_bin/dc-android.apk
            echo "apk_path=release_bin/dc-android.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-android-apk
          path: release_bin/dc-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "dc- Android APK Release v1.0.0"
          body: |
            ### 📱 dc- Android Standalone APK
            
            Download the APK file below and install it directly on your Android phone!
            
            - **Package**: `dc-android.apk`
            - **Platform**: Android 7.0+ (ARM64 & ARMv7)
            - **Features**: Standalone Discord Voice Controller, Background Wake-Lock, Embedded Touch Dashboard.
          files: release_bin/dc-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
