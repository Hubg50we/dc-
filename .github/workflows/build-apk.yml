name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy Latest Web UI to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp web/index.html android/app/src/main/assets/web/index.html

      - name: Generate Wrapper and Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Prepare APK
        id: find_apk
        run: |
          mkdir -p release_bin
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_bin/dc-android.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-android-apk
          path: release_bin/dc-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "dc- Android APK Release v1.0.0"
          body: |
            ### 📱 dc- Android Standalone APK
            
            Download `dc-android.apk` below and install it directly on your Android phone!
            
            - **Package**: `com.hubg50we.dc`
            - **Platform**: Android 7.0+ (Universal ARM & x86)
            - **Features**: Standalone Discord Voice Controller, Background Wake-Lock, Embedded AMOLED Touch Dashboard.
          files: release_bin/dc-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
