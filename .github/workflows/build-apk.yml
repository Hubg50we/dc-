name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Package Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libstdc++6 make cmake

      - name: Install Buildozer, Python-for-Android and Compatible Pip
        run: |
          python -m pip install "pip<24.1" "setuptools<70.0.0" wheel
          python -m pip install Cython==0.29.36 "buildozer>=1.5.0" "python-for-android>=2024.1.0"

      - name: Clean Cache and Build Android Debug APK
        run: |
          rm -rf .buildozer/
          buildozer clean || true
          buildozer -v android debug

      - name: Find and Prepare APK
        id: find_apk
        run: |
          mkdir -p release_bin
          APK_FILE=$(find bin/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_bin/dc-android.apk
            echo "apk_path=release_bin/dc-android.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-android-apk
          path: release_bin/dc-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "dc- Android APK Release v1.0.0"
          body: |
            ### 📱 dc- Android Standalone APK
            
            Download `dc-android.apk` below and install it directly on your Android phone!
            
            - **Platform**: Android 7.0+ (ARM64 & ARMv7)
            - **Features**: Standalone Discord Voice Controller, Background Wake-Lock, Embedded Touch Dashboard.
          files: release_bin/dc-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
