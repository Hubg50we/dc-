name: Run dc- Server on GitHub

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Run duration (hours, max 6 per session)'
        required: false
        default: '6'

jobs:
  run-server:
    name: 24/7 Server Runner on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt yt-dlp

      - name: Setup Cloudflared Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start dc- Server & Expose Live Link
        run: |
          python main.py > server.log 2>&1 &
          sleep 3
          echo "=========================================================="
          echo "          dc- SERVER IS ACTIVE ON GITHUB RUNNER"
          echo "=========================================================="
          echo "[*] Connecting public HTTPS URL..."
          cloudflared tunnel --url http://localhost:5000
